[tool.uv.workspace]
members = ["sdk", "collector", "workers", "evals", "demo_agents"]

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["graphify-out", "*.md"]

[tool.ruff.lint]
# ANN: type hints on every function. T20: no print outside CLIs. (rules.md section 8)
select = ["ANN", "B", "E", "F", "I", "T20", "UP"]

[tool.pytest.ini_options]
testpaths = ["sdk", "collector", "workers", "evals"]
addopts = ["--import-mode=importlib"]
